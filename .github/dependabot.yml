version: 2

# Las actualizaciones menores y de parche llegan agrupadas en un solo PR por ecosistema.
# Los saltos de versión mayor de piezas acopladas entre sí se excluyen: se hacen a mano,
# en un PR propio que migre el código y pase los checks.
updates:
  - package-ecosystem: pip
    directory: /backend
    target-branch: develop
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    open-pull-requests-limit: 3
    groups:
      backend-menores:
        update-types: [minor, patch]
    ignore:
      # Celery/kombu fijan el rango compatible de redis-py
      - dependency-name: redis
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    open-pull-requests-limit: 3
    groups:
      frontend-menores:
        update-types: [minor, patch]
    ignore:
      # React, sus tipos y react-router se migran juntos
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: react-router-dom
        update-types: ["version-update:semver-major"]
      # El plugin de React sigue la versión mayor de Vite
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # vitest 4+ exige una versión de Vite que el proyecto aún no usa
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: monthly }
    commit-message: { prefix: "ci(deps)" }
    groups:
      acciones:
        patterns: ["*"]
